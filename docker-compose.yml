services:
  backend:
    build: .
    command: ./start.sh
    expose:
      - "8000"
    volumes:
      - back_static:/app/staticfiles
      - back_media:/app/media
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - back_static:/var/html/static:ro
      - back_media:/var/html/media:ro
    depends_on:
      - backend

volumes:
  back_static:
  back_media: